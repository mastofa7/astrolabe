name: Build أسطرلاب APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the Android WebView shell
        run: |
          mkdir -p android/app/src/main/java/com/mostafa/astrolabe android/app/src/main/res/values android/app/src/main/res/mipmap-xxhdpi android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo '' | base64 -d > android/settings.gradle
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC4zLjInIGFwcGx5IGZhbHNlIH0K' | base64 -d > android/build.gradle
          echo '' | base64 -d > android/app/build.gradle
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj7Yo9iz2LfYsdmE2KfYqDwvc3RyaW5nPjwvcmVzb3VyY2VzPgo=' | base64 -d > android/app/src/main/res/values/strings.xml
          echo '' | base64 -d > android/app/src/main/AndroidManifest.xml
          echo '' | base64 -d > android/app/src/main/java/com/mostafa/astrolabe/MainActivity.java
      - name: Build debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk astrolab.apk
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-apk, path: astrolab.apk }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: أسطرلاب v1.1.0
          body: "أسطرلاب v1.1.0 — إصلاح اتجاه الإمالة (التتبع بالهاتف صار يطابق الحركة الحقيقية) وتوضيح منطقة الأرض أسفل الشاشة. يعمل بلا إنترنت. حمّل astrolab.apk وثبّته على أندرويد — إن كان v1.0.0 مثبتًا فاحذفه أولًا لاختلاف التوقيع."
          files: astrolab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
