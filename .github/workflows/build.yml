name: Build أسطرلاب APK + IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the Android project
        run: |
          cp -r native/android android
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
      - name: Build debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk astrolab.apk
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-apk, path: astrolab.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile unsigned iOS binary
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios13.0 -O -parse-as-library native/ios/SkyApp.swift -o astrolab
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload/astrolab.app
          cp astrolab Payload/astrolab.app/astrolab
          cp native/ios/Info.plist Payload/astrolab.app/Info.plist
          cp -r www Payload/astrolab.app/www
          zip -qr astrolab.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-ipa, path: astrolab.ipa }
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: astrolab-apk }
      - uses: actions/download-artifact@v4
        with: { name: astrolab-ipa }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: أسطرلاب v1.4.0
          body: "أسطرلاب v1.4.0 — إصلاح تتبع حركة الهاتف من الجذر: الجسر الأصلي يستعمل أفضل مستشعر متاح (متجه الدوران، ثم الجيروسكوب بدون بوصلة، ثم التسارع+المغناطيسية) ويمرر الاتجاه مباشرة إلى التطبيق، والتتبع يشتغل تلقائيًا أول ما تصل قراءات الحساس (والسحب بإصبعك يوقفه، وزر «يتبع هاتفك» يعيده). صفحة ضبط البوصلة تعرض الآن نوع الحساس وعدد القراءات للتشخيص. أندرويد: astrolab.apk (احذف النسخة القديمة أولًا لاختلاف التوقيع). آيفون: astrolab.ipa غير موقعة — تُثبَّت مجانًا عبر AltStore أو Sideloadly بحساب Apple عادي وتُجدَّد كل 7 أيام، أو استعمل نسخة الويب mastofa7.github.io/astrolabe/www وأضفها للشاشة الرئيسية."
          files: |
            astrolab.apk
            astrolab.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
