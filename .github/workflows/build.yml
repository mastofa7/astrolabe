name: Build أسطرلاب APK + IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the Android project
        run: |
          cp -r native/android android
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
      - name: Build debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk astrolab.apk
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-apk, path: astrolab.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile unsigned iOS binary
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios13.0 -O -parse-as-library native/ios/SkyApp.swift -o astrolab
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload/astrolab.app
          cp astrolab Payload/astrolab.app/astrolab
          cp native/ios/Info.plist Payload/astrolab.app/Info.plist
          cp -r www Payload/astrolab.app/www
          zip -qr astrolab.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-ipa, path: astrolab.ipa }
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: astrolab-apk }
      - uses: actions/download-artifact@v4
        with: { name: astrolab-ipa }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: أسطرلاب v1.8.0
          body: "أسطرلاب v1.8.0 — زر «تحديث» جديد داخل التطبيق: يفحص آخر إصدار على جيت هاب عند الضغط عليه فقط (لا يستهلك إنترنت إلا عند الطلب)، ويعرض رابط تحميل النسخة الجديدة على أندرويد (APK يُحمَّل عبر المتصفح ثم يُثبَّت بإذنك)، وعلى آيفون يوضح أن التثبيت يكون عبر AltStore أو Sideloadly لأن آيفون لا يدعم التحديث الذاتي، ونسخة الويب تُحدَّث بإعادة تحميل الصفحة. كما فُتحت الروابط الخارجية في متصفح الجهاز، وأُضيفت صفحة تحويل www/index.html لفتح الأطلس مباشرة (تحسين لنسخة iOS). كل مزايا العمل بلا إنترنت كما هي، وكود الحركة دون تغيير. أندرويد: astrolab.apk (احذف النسخة القديمة أولًا)."
          files: |
            astrolab.apk
            astrolab.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
