name: Build أسطرلاب APK + IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the Android WebView shell
        run: |
          mkdir -p android/app/src/main/java/com/mostafa/astrolabe android/app/src/main/res/values android/app/src/main/res/mipmap-xxhdpi android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo '' | base64 -d > android/settings.gradle
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC4zLjInIGFwcGx5IGZhbHNlIH0K' | base64 -d > android/build.gradle
          echo '' | base64 -d > android/app/build.gradle
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj7Yo9iz2LfYsdmE2KfYqDwvc3RyaW5nPjwvcmVzb3VyY2VzPgo=' | base64 -d > android/app/src/main/res/values/strings.xml
          echo '' | base64 -d > android/app/src/main/AndroidManifest.xml
          echo '' | base64 -d > android/app/src/main/java/com/mostafa/astrolabe/MainActivity.java
      - name: Build debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk astrolab.apk
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-apk, path: astrolab.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the iOS WKWebView shell
        run: |
          mkdir -p ios
          echo '' | base64 -d > ios/SkyApp.swift
          echo '' | base64 -d > ios/Info.plist
      - name: Compile unsigned iOS binary
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios13.0 -O ios/SkyApp.swift -o astrolab
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload/astrolab.app
          cp astrolab Payload/astrolab.app/astrolab
          cp ios/Info.plist Payload/astrolab.app/Info.plist
          cp -r www Payload/astrolab.app/www
          zip -qr astrolab.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: astrolab-ipa, path: astrolab.ipa }
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: astrolab-apk }
      - uses: actions/download-artifact@v4
        with: { name: astrolab-ipa }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: أسطرلاب v1.3.0
          body: "أسطرلاب v1.3.0 — تنعيم تتبع الحركة (مرشح تمهيدي على الحساسات، بلا اهتزاز) لأندرويد، وأول نسخة آيفون astrolab.ipa (غير موقعة: تُثبَّت مجانًا عبر AltStore أو Sideloadly بحساب Apple عادي، وتُجدَّد كل 7 أيام). نسخة الويب للآيفون بدون تثبيت: mastofa7.github.io/astrolabe/www — أضفها للشاشة الرئيسية من سفاري. على أندرويد: احذف النسخة القديمة أولًا لاختلاف التوقيع ثم ثبّت astrolab.apk."
          files: |
            astrolab.apk
            astrolab.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
