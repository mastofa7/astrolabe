plugins { id 'com.android.application' }
android {
  namespace 'com.mostafa.astrolabe'
  compileSdk 34
  signingConfigs {
    stable { storeFile file(System.getenv('ASTROLABE_KEYSTORE') ?: 'unused.keystore'); storePassword 'android'; keyAlias 'astrolabe'; keyPassword 'android' }
  }
  buildTypes { debug { signingConfig signingConfigs.stable } }
  defaultConfig {
    applicationId "com.mostafa.astrolabe"
    minSdk 24
    targetSdk 34
    versionCode 10
    versionName "1.9.0"
  }
}

dependencies { implementation "androidx.core:core:1.12.0" }
